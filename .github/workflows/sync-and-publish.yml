name: Sync and Publish

on:
  # Triggered by powerhouse monorepo after release
  repository_dispatch:
    types: [powerhouse-release, dependency-release]

  # Manual trigger or dispatched per-branch
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - dev
          - staging
          - latest
        default: 'dev'
      sync:
        description: 'Sync powerhouse dependencies first'
        required: false
        type: boolean
        default: true
      dry-run:
        description: 'Dry run (skip publishing)'
        required: false
        type: boolean
        default: false
      skip-docker:
        description: 'Skip Docker build and push'
        required: false
        type: boolean
        default: false
      powerhouse-version:
        description: 'Powerhouse monorepo version (set by dispatch)'
        required: false
        type: string
        default: ''
      dep-package:
        description: 'Downstream dependency package name (set by dependency-release)'
        required: false
        type: string
        default: ''
      dep-version:
        description: 'Downstream dependency version (set by dependency-release)'
        required: false
        type: string
        default: ''

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  DOCKER_REGISTRY: cr.vetra.io
  GHCR_REGISTRY: ghcr.io

jobs:
  # ==========================================================================
  # Dispatch: route repository_dispatch to the correct branch
  # (dev→dev, staging→staging, latest→main)
  # ==========================================================================
  dispatch:
    name: Dispatch
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Determine target branch
        id: target
        run: |
          EVENT_TYPE="${{ github.event.action }}"
          CHANNEL="${{ github.event.client_payload.channel }}"

          if [ "$EVENT_TYPE" = "dependency-release" ]; then
            DEP_PACKAGE="${{ github.event.client_payload.package }}"
            DEP_VERSION="${{ github.event.client_payload.version }}"
            echo "dep_package=$DEP_PACKAGE" >> $GITHUB_OUTPUT
            echo "dep_version=$DEP_VERSION" >> $GITHUB_OUTPUT
          fi

          case "$CHANNEL" in
            dev) BRANCH="dev" ;;
            staging) BRANCH="staging" ;;
            *) BRANCH="main" ;;
          esac
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL:-latest}" >> $GITHUB_OUTPUT
          echo "Routing channel=$CHANNEL to branch=$BRANCH"

      - name: Trigger workflow on ${{ steps.target.outputs.branch }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ steps.target.outputs.dep_package }}" ]; then
            EXTRA_ARGS="-f dep-package=${{ steps.target.outputs.dep_package }} -f dep-version=${{ steps.target.outputs.dep_version }}"
          fi

          gh workflow run "Sync and Publish" \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.target.outputs.branch }}" \
            -f channel="${{ steps.target.outputs.channel }}" \
            -f sync=true \
            -f dry-run=false \
            -f skip-docker=false \
            -f powerhouse-version="${{ github.event.client_payload.powerhouse_version || github.event.client_payload.version }}" \
            $EXTRA_ARGS
        env:
          GH_TOKEN: ${{ secrets.K8S_REPO_PAT }}

  # ==========================================================================
  # Sync powerhouse dependencies (workflow_dispatch only)
  # ==========================================================================
  sync:
    name: Sync Dependencies
    if: github.event_name == 'workflow_dispatch' && inputs.sync == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Powerhouse dependencies
        run: |
          CHANNEL="${{ inputs.channel }}"
          # Map channel to npm dist-tag
          case "$CHANNEL" in
            dev) TAG="dev" ;;
            staging) TAG="staging" ;;
            *) TAG="latest" ;;
          esac

          # Downstream packages that have their own release cycle
          EXCLUDE="@powerhousedao/clicker-game"

          PACKAGES=$(node -e "
            const pkg = require('./package.json');
            const deps = {...pkg.dependencies, ...pkg.devDependencies};
            const exclude = '${EXCLUDE}'.split(' ').filter(Boolean);
            const names = Object.keys(deps).filter(d =>
              !exclude.includes(d) &&
              (d.startsWith('@powerhousedao/') || ['document-model','document-drive','ph-cmd'].includes(d))
            );
            console.log(names.join(' '));
          ")

          echo "Updating packages to @$TAG: $PACKAGES"
          for pkg in $PACKAGES; do
            pnpm add "${pkg}@${TAG}" || echo "Warning: Failed to update $pkg"
          done

      - name: Update downstream dependency
        if: inputs.dep-package != '' && inputs.dep-version != ''
        run: |
          echo "Updating downstream dependency ${{ inputs.dep-package }}@${{ inputs.dep-version }}"
          pnpm add "${{ inputs.dep-package }}@${{ inputs.dep-version }}"

      - name: Install dependencies
        run: pnpm install

      - name: Generate code
        run: pnpm generate

      - name: Build package
        run: pnpm build

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet package.json pnpm-lock.yaml; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No dependency changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Dependency changes detected"
          fi

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry-run != true
        run: |
          git add package.json pnpm-lock.yaml
          git add -A document-models/*/gen/ editors/*/gen/ || true
          PH_VERSION="${{ inputs.powerhouse-version }}"
          if [ -n "$PH_VERSION" ]; then
            git commit -m "chore: sync powerhouse dependencies to $PH_VERSION"
          else
            git commit -m "chore: sync powerhouse dependencies"
          fi

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry-run != true
        run: git push

  # ==========================================================================
  # Release: version bump + npm publish (workflow_dispatch only)
  # ==========================================================================
  release:
    name: Release
    needs: sync
    if: always() && github.event_name == 'workflow_dispatch' && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Generate code
        run: pnpm generate

      - name: Build package
        run: pnpm build

      - name: Run tests
        run: pnpm test || true
        continue-on-error: true

      - name: Bump version
        id: version
        run: |
          CHANNEL="${{ inputs.channel }}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # Determine new version
          if [ "$CHANNEL" = "latest" ] || [ "$CHANNEL" = "main" ]; then
            npm version patch --no-git-tag-version
          else
            npm version prerelease --preid=$CHANNEL --no-git-tag-version
          fi

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped version: $CURRENT_VERSION -> $NEW_VERSION"

          # Check if this version is already published on npm
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE_NAME}@${NEW_VERSION}" version 2>/dev/null; then
            echo "released=false" >> $GITHUB_OUTPUT
            echo "Version $NEW_VERSION already published, skipping"
          else
            echo "released=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and tag
        if: inputs.dry-run != true && steps.version.outputs.released == 'true'
        run: |
          git add package.json pnpm-lock.yaml
          git add -A document-models/*/gen/ editors/*/gen/ || true
          PH_VERSION="${{ inputs.powerhouse-version }}"
          if [ -n "$PH_VERSION" ]; then
            git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} (powerhouse $PH_VERSION)" || echo "No changes to commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}" || echo "No changes to commit"
          fi
          git tag "v${{ steps.version.outputs.new_version }}"
          git push && git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Publish to npm
        if: inputs.dry-run != true && steps.version.outputs.released == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_ACCESS_TOKEN not set, skipping npm publish"
            exit 0
          fi
          CHANNEL="${{ inputs.channel }}"
          if [ "$CHANNEL" = "latest" ] || [ "$CHANNEL" = "main" ]; then
            pnpm publish --access public --tag latest --no-git-checks
          else
            pnpm publish --access public --tag $CHANNEL --no-git-checks
          fi

  # ==========================================================================
  # Build and push Docker images
  # ==========================================================================
  build-docker:
    name: Build Docker Images
    needs: release
    if: |
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      inputs.skip-docker != true &&
      inputs.dry-run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [connect, switchboard]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Docker project exists
        run: |
          PROJECT_NAME="demo"

          # Check if project exists, create if not
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
            "https://${{ env.DOCKER_REGISTRY }}/api/v2.0/projects?name=${PROJECT_NAME}")

          if [ "$STATUS" = "200" ]; then
            EXISTS=$(curl -s \
              -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
              "https://${{ env.DOCKER_REGISTRY }}/api/v2.0/projects?name=${PROJECT_NAME}" | \
              jq -r ".[] | select(.name==\"${PROJECT_NAME}\") | .name")

            if [ "$EXISTS" = "$PROJECT_NAME" ]; then
              echo "Project ${PROJECT_NAME} already exists"
            else
              echo "Creating project ${PROJECT_NAME}..."
              curl -X POST \
                -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
                -H "Content-Type: application/json" \
                -d "{\"project_name\": \"${PROJECT_NAME}\", \"public\": false}" \
                "https://${{ env.DOCKER_REGISTRY }}/api/v2.0/projects"
            fi
          else
            echo "Creating project ${PROJECT_NAME}..."
            curl -X POST \
              -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
              -H "Content-Type: application/json" \
              -d "{\"project_name\": \"${PROJECT_NAME}\", \"public\": false}" \
              "https://${{ env.DOCKER_REGISTRY }}/api/v2.0/projects"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract package name
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Determine image tags
        id: tags
        run: |
          VERSION="${{ needs.release.outputs.new_version }}"
          CHANNEL="${{ inputs.channel }}"
          PROJECT="demo"
          TARGET="${{ matrix.target }}"

          # GHCR tags
          GHCR_BASE="${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${PROJECT}/${TARGET}"

          # Docker registry tags
          DOCKER_BASE="${{ env.DOCKER_REGISTRY }}/${PROJECT}/${TARGET}"

          # Build tag list
          TAGS="${GHCR_BASE}:v${VERSION}"
          TAGS="${TAGS},${DOCKER_BASE}:v${VERSION}"

          # Add channel tag
          if [ "$CHANNEL" = "latest" ] || [ "$CHANNEL" = "main" ]; then
            TAGS="${TAGS},${GHCR_BASE}:latest"
            TAGS="${TAGS},${DOCKER_BASE}:latest"
          else
            TAGS="${TAGS},${GHCR_BASE}:${CHANNEL}"
            TAGS="${TAGS},${DOCKER_BASE}:${CHANNEL}"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Image tags: $TAGS"

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TAG=${{ inputs.channel == 'latest' && 'latest' || inputs.channel }}
            PACKAGE_NAME=${{ steps.package.outputs.name }}
            PH_CONNECT_BASE_PATH=/
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Update k8s-hosting repo with new image tags (GitOps)
  # ==========================================================================
  update-k8s:
    name: Update K8s Hosting
    needs: [release, build-docker]
    if: |
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.build-docker.result == 'success' &&
      inputs.dry-run != true &&
      (inputs.channel == 'dev' || inputs.channel == 'staging' || inputs.channel == 'latest')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k8s-hosting repository
        uses: actions/checkout@v4
        with:
          repository: powerhouse-inc/powerhouse-k8s-hosting
          token: ${{ secrets.K8S_REPO_PAT }}
          path: k8s-hosting

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update image tags
        run: |
          CHANNEL="${{ inputs.channel }}"
          VERSION="v${{ needs.release.outputs.new_version }}"

          # Map channel to tenant directory
          case "$CHANNEL" in
            dev) TENANT="dev" ;;
            staging) TENANT="staging" ;;
            latest) TENANT="demo" ;;
            *) TENANT="$CHANNEL" ;;
          esac

          VALUES_FILE="k8s-hosting/tenants/${TENANT}/powerhouse-values.yaml"

          echo "Updating ${VALUES_FILE} with version ${VERSION}"

          # Update switchboard image tag
          yq -i ".switchboard.image.tag = \"${VERSION}\"" "$VALUES_FILE"

          # Update connect image tag
          yq -i ".connect.image.tag = \"${VERSION}\"" "$VALUES_FILE"

          echo "Updated image tags to ${VERSION}"
          cat "$VALUES_FILE" | grep -A2 "image:" | head -20

      - name: Commit and push changes
        run: |
          cd k8s-hosting
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHANNEL="${{ inputs.channel }}"
          VERSION="v${{ needs.release.outputs.new_version }}"

          # Map channel to tenant directory
          case "$CHANNEL" in
            dev) TENANT="dev" ;;
            staging) TENANT="staging" ;;
            latest) TENANT="demo" ;;
            *) TENANT="$CHANNEL" ;;
          esac

          git add "tenants/${TENANT}/powerhouse-values.yaml"

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(${TENANT}): update image tags to ${VERSION}"
            git push
          fi

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Summary
    needs: [sync, release, build-docker, update-k8s]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Channel | ${{ inputs.channel }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sync | ${{ inputs.sync }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.release.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Released | ${{ needs.release.outputs.released }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ inputs.dry-run }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ inputs.powerhouse-version }}" ]; then
            echo "| Powerhouse Version | ${{ inputs.powerhouse-version }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.release.outputs.released }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.DOCKER_REGISTRY }}/demo/connect:v${{ needs.release.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.DOCKER_REGISTRY }}/demo/switchboard:v${{ needs.release.outputs.new_version }}\`" >> $GITHUB_STEP_SUMMARY
          fi
